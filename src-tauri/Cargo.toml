[package]
name = "mori-desktop-pet"
version = "0.1.1"
description = "Local-first pixel pet for a private AI assistant"
authors = ["Mori"]
edition = "2021"

[lib]
name = "mori_desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.9.8"
enigo = { version = "0.6.1", default-features = false }
uiautomation = "0.25.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
