[package]
name = "mori-desktop-pet"
version = "0.1.0"
description = "Local-first pixel pet for a private AI assistant"
authors = ["Mori"]
edition = "2021"

[lib]
name = "mori_desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
keyring = "4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
