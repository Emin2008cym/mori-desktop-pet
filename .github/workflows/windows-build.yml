name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup target add x86_64-pc-windows-msvc --toolchain stable-x86_64-pc-windows-msvc
          rustc +stable-x86_64-pc-windows-msvc --version

      - name: Install JavaScript dependencies
        run: npm.cmd ci

      - name: Run tests
        run: npm.cmd test

      - name: Build frontend
        run: npm.cmd run build

      - name: Build unsigned MSI and NSIS packages
        run: npm.cmd run tauri:build -- --no-sign --ci

      - name: Ensure bundled Node runtime has no native add-ons
        shell: pwsh
        run: |
          $nativeAddons = @(Get-ChildItem 'src-tauri/resources/node_modules' -Filter '*.node' -File -Recurse -ErrorAction SilentlyContinue)
          if ($nativeAddons.Count -gt 0) {
            throw "Unsigned native Node add-ons would be bundled: $($nativeAddons.Name -join ', ')"
          }

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $bundleRoot = 'src-tauri/target/release/bundle'
          $packages = @(
            Get-ChildItem "$bundleRoot/msi" -Filter '*.msi' -File -ErrorAction SilentlyContinue
            Get-ChildItem "$bundleRoot/nsis" -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue
          )
          if ($packages.Count -ne 2) {
            throw "Expected one MSI and one NSIS setup executable; found $($packages.Count) package(s)."
          }
          $manifest = Join-Path $bundleRoot 'SHA256SUMS.txt'
          $lines = foreach ($package in $packages) {
            $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($package.Name)"
          }
          [System.IO.File]::WriteAllLines($manifest, $lines, [System.Text.Encoding]::ASCII)

      - name: Stage local developer package payload
        shell: pwsh
        env:
          PACKAGE_VERSION: 0.1.0.${{ github.run_number }}
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'mori-dev-payload'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Copy-Item 'src-tauri/target/release/mori-desktop-pet.exe' $payload
          Copy-Item 'src-tauri/resources' $payload -Recurse
          New-Item -ItemType Directory -Path (Join-Path $payload 'Assets') -Force | Out-Null
          Copy-Item 'src-tauri/icons/StoreLogo.png' (Join-Path $payload 'Assets/StoreLogo.png')
          Copy-Item 'src-tauri/icons/Square150x150Logo.png' (Join-Path $payload 'Assets/Square150x150Logo.png')
          Copy-Item 'src-tauri/icons/Square44x44Logo.png' (Join-Path $payload 'Assets/Square44x44Logo.png')
          Copy-Item 'installer/msix/AppxManifest.xml' $payload
          Copy-Item 'scripts/install-mori-dev.mjs' $payload
          Copy-Item 'scripts/uninstall-mori-dev.mjs' $payload
          Copy-Item 'installer/msix/README.zh-CN.md' $payload
          [System.IO.File]::WriteAllText((Join-Path $payload 'package-version.txt'), $env:PACKAGE_VERSION, [System.Text.Encoding]::ASCII)
          $archive = Join-Path $env:RUNNER_TEMP 'Mori-Dev-Payload.zip'
          Compress-Archive -Path (Join-Path $payload '*') -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'Mori-Dev-Payload-SHA256.txt'), "$hash  Mori-Dev-Payload.zip", [System.Text.Encoding]::ASCII)

      - name: Upload local developer package payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mori-windows-dev-payload
          path: |
            ${{ runner.temp }}/Mori-Dev-Payload.zip
            ${{ runner.temp }}/Mori-Dev-Payload-SHA256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned validation packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mori-windows-unsigned
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
