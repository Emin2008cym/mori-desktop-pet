name: Signed Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Mori release tag to build and sign (for example, v0.1.1)
        required: true
        type: string

permissions: {}

jobs:
  validate-release:
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate published release source
        id: validate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tag must use the vMAJOR.MINOR.PATCH format.'
          }
          gh release view "$env:RELEASE_TAG" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Release $env:RELEASE_TAG does not exist." }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main for release source verification.' }
          $releaseCommit = git rev-parse "$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not resolve to a commit.' }
          git merge-base --is-ancestor $releaseCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag is not an ancestor of main.' }
          "commit=$releaseCommit" >> $env:GITHUB_OUTPUT

  sign-and-publish:
    needs: validate-release
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    environment: release-signing
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup target add x86_64-pc-windows-msvc --toolchain stable-x86_64-pc-windows-msvc
          rustc +stable-x86_64-pc-windows-msvc --version

      - name: Install dependencies and run checks
        shell: pwsh
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          npm.cmd run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }

      - name: Build Mori executable without installers
        run: npm.cmd run tauri:build -- --no-bundle --no-sign --ci

      - name: Verify bundled Node runtime signature
        shell: pwsh
        run: |
          $nativeAddons = @(Get-ChildItem 'src-tauri/resources/node_modules' -Filter '*.node' -File -Recurse -ErrorAction SilentlyContinue)
          if ($nativeAddons.Count -gt 0) {
            throw "Unsigned native Node add-ons would be bundled: $($nativeAddons.Name -join ', ')"
          }
          $nodePath = 'src-tauri/resources/binaries/node.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $nodePath
          if ($signature.Status -ne 'Valid') {
            throw "Bundled Node.js signature is not valid: $($signature.Status)"
          }

      - name: Upload unsigned Mori executable
        id: upload-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mori-app-unsigned
          path: src-tauri/target/release/mori-desktop-pet.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Mori executable
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mori
          signing-policy-slug: release-signing
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIGURATION }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-app

      - name: Install signed Mori executable
        shell: pwsh
        run: |
          $signedFiles = @(Get-ChildItem 'signed-app' -Filter 'mori-desktop-pet.exe' -File -Recurse)
          if ($signedFiles.Count -ne 1) {
            throw "Expected exactly one signed Mori executable; found $($signedFiles.Count)."
          }
          Copy-Item -LiteralPath $signedFiles[0].FullName -Destination 'src-tauri/target/release/mori-desktop-pet.exe' -Force
          $signature = Get-AuthenticodeSignature -LiteralPath 'src-tauri/target/release/mori-desktop-pet.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Mori executable signature is not valid: $($signature.Status)"
          }

      - name: Bundle signed Mori executable
        run: npm.cmd exec -- tauri bundle --bundles msi nsis --no-sign --no-binary-patching --ci

      - name: Upload unsigned installer containers
        id: upload-installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mori-installers-unsigned
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign MSI and NSIS installers
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mori
          signing-policy-slug: release-signing
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION }}
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-installers

      - name: Verify signed installers and create hash manifest
        id: verify-installers
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem 'signed-installers' -Filter '*.msi' -File -Recurse
            Get-ChildItem 'signed-installers' -Filter '*-setup.exe' -File -Recurse
          )
          if ($packages.Count -ne 2) {
            throw "Expected one signed MSI and one signed NSIS installer; found $($packages.Count)."
          }
          foreach ($package in $packages) {
            $signature = Get-AuthenticodeSignature -LiteralPath $package.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Installer signature is not valid for $($package.Name): $($signature.Status)"
            }
          }
          $manifest = Join-Path 'signed-installers' 'SHA256SUMS.txt'
          $lines = foreach ($package in $packages) {
            $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($package.Name)"
          }
          [System.IO.File]::WriteAllLines($manifest, $lines, [System.Text.Encoding]::ASCII)

      - name: Upload signed release assets for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mori-windows-signed
          path: |
            signed-installers/*.msi
            signed-installers/*-setup.exe
            signed-installers/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: sign-and-publish
    runs-on: windows-2025
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mori-windows-signed
          path: signed-installers

      - name: Attach signed assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          gh release view "$env:RELEASE_TAG" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Release $env:RELEASE_TAG does not exist." }
          $packages = @(
            Get-ChildItem 'signed-installers' -Filter '*.msi' -File -Recurse
            Get-ChildItem 'signed-installers' -Filter '*-setup.exe' -File -Recurse
          )
          if ($packages.Count -ne 2) {
            throw "Expected one signed MSI and one signed NSIS installer; found $($packages.Count)."
          }
          foreach ($package in $packages) {
            gh release upload "$env:RELEASE_TAG" "$($package.FullName)" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload $($package.Name) to the release." }
          }
          gh release upload "$env:RELEASE_TAG" 'signed-installers/SHA256SUMS.txt' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the SHA-256 manifest.' }
